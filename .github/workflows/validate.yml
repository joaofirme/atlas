name: Validar Atlas
on: [push, pull_request]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/atlas.py validate
      - run: python -m unittest discover -s tests
      - run: python scripts/atlas.py build
      - run: git diff --exit-code -- catalog docs/catalogo.md docs/catalogo-tecnico.md
