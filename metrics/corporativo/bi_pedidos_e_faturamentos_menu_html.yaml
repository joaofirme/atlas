implementations:
  dax:
    expression: |2-
      // ==========================================================
      // CONTROLE DA BASE DE RECEITA
      // ==========================================================
      VAR vBaseReceitaSelecionada =
          SELECTEDVALUE(
              'Base Receita'[Base Receita],
              "Receita Semi Líquida"
          )
      
      VAR vUsarReceitaBruta =
          vBaseReceitaSelecionada = "Receita Bruta"
      
      VAR vTagBase =
          IF(
              vUsarReceitaBruta,
              "BASE RB",
              "BASE RSL"
          )
      
      // ==========================================================
      // PERÍODO ATUAL / MÊS PARCIAL
      // ==========================================================
      VAR vDataInicialSelecionada =
          MIN('dTempo'[Data])
      
      VAR vDataFinalSelecionada =
          MAX('dTempo'[Data])
      
      VAR vMesSelecionadoAtual =
          NOT ISBLANK(vDataFinalSelecionada)
              && YEAR(vDataFinalSelecionada) = YEAR(TODAY())
              && MONTH(vDataFinalSelecionada) = MONTH(TODAY())
      
      VAR vDataFinalComparavel =
          IF(
              vMesSelecionadoAtual,
              MIN(
                  TODAY(),
                  EOMONTH(vDataFinalSelecionada, 0)
              ),
              vDataFinalSelecionada
          )
      
      VAR vInicioMesAtual =
          DATE(YEAR(TODAY()), MONTH(TODAY()), 1)
      
      VAR vFimMesAtual =
          EOMONTH(TODAY(), 0)
      
      VAR vPeriodoIncluiMesAtual =
          NOT ISBLANK(vDataInicialSelecionada)
              && NOT ISBLANK(vDataFinalSelecionada)
              && vDataInicialSelecionada <= vFimMesAtual
              && vDataFinalSelecionada >= vInicioMesAtual
      
      VAR vParcialBadge =
          IF(
              vPeriodoIncluiMesAtual,
              "<span class=""badge partial-badge"">Mês parcial até dia "
                  & FORMAT(DAY(vDataFinalComparavel), "0")
                  & "</span>",
              ""
          )
      
      // ==========================================================
      // CONTEXTO DE EMPRESA — HIERARQUIA dEmpresa
      // Empresa > Description
      // ==========================================================
      VAR vEmpresaSelecionada =
          SELECTEDVALUE(
              'dEmpresa'[Empresa]
          )
      
      VAR vDescricaoEmpresaSelecionada =
          SELECTEDVALUE(
              'dEmpresa'[Description]
          )
      
      VAR vEmpresaContexto =
          SWITCH(
              TRUE(),
      
              HASONEVALUE('dEmpresa'[Description])
                  && NOT ISBLANK(vDescricaoEmpresaSelecionada),
                  COALESCE(vEmpresaSelecionada, "Empresa")
                      & " › "
                      & vDescricaoEmpresaSelecionada,
      
              HASONEVALUE('dEmpresa'[Empresa])
                  && NOT ISBLANK(vEmpresaSelecionada),
                  vEmpresaSelecionada,
      
              ISFILTERED('dEmpresa'[Empresa])
                  || ISFILTERED('dEmpresa'[Description]),
                  "Múltiplas empresas",
      
              "Grupo"
          )
      
      // ==========================================================
      // ATUALIZAÇÃO
      // ==========================================================
      VAR vAtualizacaoContexto =
          [00 Atualização]
      
      VAR fAtualizacaoContexto =
          IF(
              ISBLANK(vAtualizacaoContexto),
              "-",
              IF(
                  ISTEXT(vAtualizacaoContexto),
                  TRIM(
                      SUBSTITUTE(
                          vAtualizacaoContexto,
                          "Atualizado em:",
                          ""
                      )
                  ),
                  FORMAT(
                      vAtualizacaoContexto,
                      "dd/mm/yyyy hh:mm"
                  )
              )
          )
      
      // ==========================================================
      // CSS — BARRA SUPERIOR
      // ==========================================================
      VAR CSS =
      "<style>
      html,body{
          margin:0;
          padding:0;
          background:#F2F5F9;
          border:0;
          outline:0;
      }
      
      :root{
          --brand:#023F76;
          --brand-deep:#062A4C;
          --accent-line:#BDD4E9;
          --card-2:#F3F5F7;
          --font:'Segoe UI',Arial,sans-serif;
      }
      
      .ctxline{
          display:flex;
          align-items:center;
          gap:14px;
          flex-wrap:wrap;
          background:#F8FAFC;
          border-top:1px solid #D7E2EE;
          border-bottom:1px solid #D7E2EE;
          padding:9px 14px;
          margin:0;
          font-family:var(--font);
          font-size:13px;
          color:var(--brand-deep);
          line-height:1.30;
          min-height:34px;
          font-weight:650;
          width:100%;
          box-sizing:border-box;
      }
      
      .ctxline b{
          font-size:12px;
          font-weight:950;
          letter-spacing:.10em;
          text-transform:uppercase;
          color:var(--brand-deep);
          margin-right:5px;
      }
      
      .ctxline span{
          display:inline-flex;
          align-items:center;
          white-space:nowrap;
      }
      
      .ctxline .ctx-divider{
          width:1px;
          height:22px;
          background:#D7E2EE;
          flex:0 0 1px;
      }
      
      .ctxline .ctx-company{
          display:inline-flex;
          align-items:center;
          gap:7px;
          min-width:0;
      }
      
      .ctxline .ctx-company-label{
          font-size:12px;
          font-weight:950;
          letter-spacing:.10em;
          text-transform:uppercase;
          color:var(--brand-deep);
      }
      
      .ctxline .ctx-company-value{
          display:inline-flex;
          align-items:center;
          max-width:420px;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap;
          border:1px solid #BDD4E9;
          background:#EDF4FB;
          color:#023F76;
          border-radius:999px;
          padding:5px 12px;
          font-size:12px;
          font-weight:900;
          line-height:1.15;
          box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
      }
      
      .ctxline .ctx-right{
          margin-left:auto;
          display:inline-flex;
          align-items:center;
          gap:8px;
          flex-wrap:wrap;
      }
      
      .ctxline .ctx-base{
          display:inline-flex;
          align-items:center;
          border:1px solid var(--accent-line);
          background:#E9F1F9;
          color:var(--brand);
          border-radius:999px;
          padding:6px 15px;
          font-size:12px;
          font-weight:900;
          line-height:1.15;
      }
      
      .badge{
          display:inline-flex;
          align-items:center;
          border:1px solid var(--accent-line);
          background:var(--card-2);
          color:var(--brand);
          border-radius:999px;
          font-size:12px;
          font-weight:900;
          padding:4px 11px;
          white-space:nowrap;
          line-height:1.15;
      }
      
      .partial-badge{
          background:#FFF2D8;
          border-color:#F0C46A;
          color:#8F5600;
      }
      
      @media(max-width:900px){
          .ctxline{
              gap:9px;
          }
      
          .ctxline .ctx-divider{
              display:none;
          }
      
          .ctxline .ctx-company{
              order:3;
              width:100%;
          }
      
          .ctxline .ctx-company-value{
              max-width:calc(100% - 92px);
          }
      
          .ctxline .ctx-right{
              margin-left:auto;
          }
      }
      
      @media(max-width:680px){
          .ctxline{
              gap:10px;
          }
      
          .ctxline .ctx-right{
              width:100%;
              margin-left:0;
              justify-content:flex-start;
          }
      }
      </style>"
      
      // ==========================================================
      // HTML — BARRA SUPERIOR
      // ==========================================================
      VAR HCTX =
          "<div class=""ctxline"">" &
              "<span><b>ATUALIZADO</b> " & fAtualizacaoContexto & "</span>" &
              "<span class=""ctx-divider""></span>" &
              "<span class=""ctx-company"">" &
                  "<span class=""ctx-company-label"">EMPRESA</span>" &
                  "<span class=""ctx-company-value"">" & vEmpresaContexto & "</span>" &
              "</span>" &
              "<span class=""ctx-right"">" &
                  vParcialBadge &
                  "<span class=""ctx-base"">" & vTagBase & "</span>" &
              "</span>" &
          "</div>"
      
      RETURN
      CSS &
      HCTX
    table: "_Medidas"
