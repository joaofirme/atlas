implementations:
  dax:
    expression: |2-
      VAR vFinanceiroFarmax =
          CALCULATE(
              [04 Aberto]
              ,fVendas_unificada[empresa] = "FARMAX"
              ,fVendas_unificada[obt_sales_department_status] = "FINANCEIRO"
          )
      
      VAR vFinanceiroSanavita =
          CALCULATE(
              [04 Aberto]
              ,fVendas_unificada[empresa] = "SANAVITA"
              ,fVendas_unificada[sale_billing_block_code] IN {"SERASA", "TRAVA.FINANCEIRO", "PEND.FINANCEIRA", "TRAVA.LIMITE.CREDITO"}
          )
      
      RETURN
          (COALESCE(vFinanceiroFarmax, 0) + COALESCE(vFinanceiroSanavita, 0)) + 0
