implementations:
  dax:
    expression: |2-
      VAR vRetLimiteFarmax =
          CALCULATE(
              [00 Financeiro]
              ,fVendas_unificada[empresa] = "FARMAX"
              ,fVendas_unificada[sale_billing_block_code] = "Z5"
          )
      
      VAR vRetLimiteSanavita =
          CALCULATE(
              [00 Financeiro]
              ,fVendas_unificada[empresa] = "SANAVITA"
              ,fVendas_unificada[sale_billing_block_code] = "TRAVA.LIMITE.CREDITO"
          )
      
      RETURN
          (COALESCE(vRetLimiteFarmax, 0) + COALESCE(vRetLimiteSanavita, 0)) + 0
