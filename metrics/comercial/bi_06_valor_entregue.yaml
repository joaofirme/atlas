implementations:
  dax:
    expression: |2-
      VAR vBaseReceita =
          SELECTEDVALUE(
              'Base Receita'[Base Receita],
              "Receita Semi Líquida"
          )
      
      RETURN
          IF(
              vBaseReceita = "Receita Bruta",
              CALCULATE(
                  [08 Faturamento Bruto],
                  KEEPFILTERS(
                      NOT ISBLANK(
                          fVendas_unificada[data_entrega]
                      )
                  ),
                  KEEPFILTERS(
                      fVendas_unificada[data_entrega] <= TODAY()
                  )
              ),
              CALCULATE(
                  [00 Faturamento],
                  KEEPFILTERS(
                      NOT ISBLANK(
                          fVendas_unificada[data_entrega]
                      )
                  ),
                  KEEPFILTERS(
                      fVendas_unificada[data_entrega] <= TODAY()
                  )
              )
          )
    table: "_Medidas"
    properties:
      displayFolder: "01 Vendas"
      lineageTag: "3a0cd8f1-3d74-4095-9f93-71ac5245be94"
    execution_validated: false
    note: "Expressão extraída, preservando comentários. Fonte PBIP é a evidência; este contrato é um rascunho de ingestão."
