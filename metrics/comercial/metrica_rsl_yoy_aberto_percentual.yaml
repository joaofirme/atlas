implementations:
  dax:
    expression: |2-
      VAR vData_max = MAX(fVendas_unificada[data_movimento])
      VAR vData_limite = EDATE(vData_max, -12)
      VAR vResultado = --RSL MTD
      
          CALCULATE(
              [03 RSL],
              SAMEPERIODLASTYEAR(dTempo[Data]),
              FILTER(
                  ALL(dTempo[Data]),
                  dTempo[Data] <= vData_limite
              )
          )
      
      Return
      
          DIVIDE(
              [03 RSL]
              ,vResultado
          )-1
