implementations:
  dax:
    expression: |2-
      VAR vEmpresaFiltro = SELECTEDVALUE(dEmpresa[Company])
      RETURN
          CALCULATE(
              SUM(fCarteira_pedidos_unificada[order_sale_subtotal]),
              fCarteira_pedidos_unificada[data_carteira] = DATE(YEAR(MAX(dTempo[Data])), MONTH(MAX(dTempo[Data])), 1),
              REMOVEFILTERS(dTempo),
              IF(
                  NOT ISBLANK(vEmpresaFiltro),
                  fCarteira_pedidos_unificada[company] = vEmpresaFiltro,
                  TRUE()
              )
          )
