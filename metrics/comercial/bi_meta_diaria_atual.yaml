implementations:
  dax:
    expression: |2-
      VAR _DeltaRSL = ([Meta RSL] - [03 RSL])
      
      VAR _DiasUteis = MIN(fMeta_Geral[general_target_days])
      
      VAR _Feriado = 
      	NETWORKDAYS(
      		MIN('dTempo'[Data]),
      		TODAY(), 
      		1,
              dFeriado
          )
      
      VAR _MetaDia = 
          DIVIDE(
              _DeltaRSL
              ,_DiasUteis - _Feriado
              ,0
          )
      
       RETURN
             IF(
                 SELECTEDVALUE('dTempo'[MesNum]) <> MONTH(TODAY()) || _MetaDia < 0,
                 0,
                 _MetaDia
              )
    table: "_Medidas"
    properties:
      formatString: "#,0"
      displayFolder: "07 Meta"
      lineageTag: "6ba67c54-a34c-4994-ab94-be63f0e1f7d6"
    execution_validated: false
    note: "Expressão extraída, preservando comentários. Fonte PBIP é a evidência; este contrato é um rascunho de ingestão."
