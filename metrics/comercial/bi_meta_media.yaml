implementations:
  dax:
    expression: |2-
      VAR MRSL = 
          CALCULATE(
              SUMX(
                  SUMMARIZE ( 
                      fMeta_unificada,
                      fMeta_unificada[empresa],
                      fMeta_unificada[cod_executivo], 
                      fMeta_unificada[chave_regional], 
                      fMeta_unificada[chave_marca], 
                      fMeta_unificada[meta_receita]
                  )
                  ,fMeta_unificada[meta_receita] 
              )
              ,REMOVEFILTERS(dTempo[DiaNum])
          )
      
      VAR Dias =
          CALCULATE(
              min(fMeta_Geral[general_target_days])
              ,REMOVEFILTERS(dTempo[DiaNum])
          )
      
      VAR MetaMedia =
      
          DIVIDE(
              MRSL
              ,Dias
          )
      
      RETURN
      
          IF([03 RSL] = 0, BLANK(),MetaMedia)
    table: "_Medidas"
    properties:
      formatString: "#,0"
      displayFolder: "07 Meta"
      lineageTag: "2ad9b8ed-94e2-4280-8b7a-bcbd81f62858"
    execution_validated: false
    note: "Expressão extraída, preservando comentários. Fonte PBIP é a evidência; este contrato é um rascunho de ingestão."
