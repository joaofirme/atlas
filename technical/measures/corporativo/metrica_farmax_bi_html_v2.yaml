      VAR vCSS04 = ".topbar{background:var(--card);border-bottom:1px solid var(--line);padding:11px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}.topbar h1{font-size:var(--fs-h1);font-weight:720;letter-spacing:-.015em;}.topbar .sub{color:var(--ink-3);font-size:var(--fs-lbl);font-weight:500;display:block;}.filters{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}.fgroup{display:flex;flex-direction:column;gap:3px;}.fgroup label{font-size:var(--fs-foot);font-weight:660;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-left:2px;}select{font-family:var(--font);font-size:var(--fs-body);font-weight:580;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;min-width:110px;}select:focus{outline:2px solid var(--focus);}"
      VAR vCSS05 = ".ctxstrip{display:flex;flex-wrap:wrap;gap:5px 16px;align-items:center;background:var(--card-2);border-bottom:1px solid var(--line);padding:6px 24px;font-size:var(--fs-lbl);color:var(--ink-2);}.ctxstrip b{color:var(--ink-3);font-weight:700;font-size:var(--fs-foot);letter-spacing:.07em;text-transform:uppercase;margin-right:4px;}.ctxstrip .pill{margin-left:auto;color:var(--brand);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:2px 10px;font-weight:620;font-size:var(--fs-foot);}"
      VAR vCSS06 = ".content{padding:18px 24px 60px;flex:1;}.page{display:none;}.page.active{display:block;}.grid{display:grid;gap:12px;}.cards{grid-template-columns:repeat(12,1fr);}.col-12{grid-column:span 12;}.col-4{grid-column:span 4;}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);min-width:0;}.card h3{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}.card .desc{font-size:var(--fs-lbl);color:var(--ink-3);margin-bottom:10px;}.card .src{font-size:var(--fs-foot);color:var(--ink-3);margin-top:10px;border-top:1px dashed var(--line);padding-top:6px;}.seclbl{font-size:var(--fs-foot);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:16px 0 6px 2px;}"
