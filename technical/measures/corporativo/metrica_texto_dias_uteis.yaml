implementations:
  dax:
    expression: |2-
      VAR Dias =
          AVERAGEX(
              VALUES('dTempo'[Mes/Ano]),
              CALCULATE(
                  AVERAGE('fMeta_Geral'[general_target_days])
              )
          )
      
      VAR Mes =
          SELECTEDVALUE(dTempo[MesNome])
      
      RETURN
      
          "Dias úteis: " & FORMAT(Dias,"0")
          --"O mês " & FORMAT(Mes,"0") & " possuí " & FORMAT(Dias,"0") & " dias úteis"
