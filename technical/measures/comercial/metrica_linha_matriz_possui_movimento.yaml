implementations:
  dax:
    expression: |2-
      VAR vVendido =
          [00 Valor de Vendas]
      VAR vReceita =
          [Receita Selecionada]
      VAR vAberto =
          CALCULATE(
              [04 Aberto],
              REMOVEFILTERS(dTempo)
          )
      VAR vProgramado =
          CALCULATE(
              [05 Programado],
              REMOVEFILTERS(dTempo)
          )
      VAR vFaturamento =
          [Faturamento Selecionado]
      VAR vDevolucao =
          [Devolução Selecionada]
      VAR vMovimento =
          COALESCE(ABS(vVendido), 0)
              + COALESCE(ABS(vReceita), 0)
              + COALESCE(ABS(vAberto), 0)
              + COALESCE(ABS(vProgramado), 0)
              + COALESCE(ABS(vFaturamento), 0)
              + COALESCE(ABS(vDevolucao), 0)
      RETURN
          IF(
              vMovimento <> 0,
              1,
              BLANK()
          )
    table: "_Medidas"
    properties:
      formatString: "0"
      displayFolder: "[Pedidos & Faturamento] Matriz dinâmica"
